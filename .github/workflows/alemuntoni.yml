name: Build alemuntoni/u3d libIDTF x64
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: 拉取源码 alemuntoni/u3d
        uses: actions/checkout@v4
        with:
          repository: alemuntoni/u3d
          path: u3d-src

      - name: 修改CMakeLists，提升最低cmake版本（规避新版CMake兼容报错）
        shell: cmd
        run: |
          cd u3d-src
          powershell -Command "(Get-Content CMakeLists.txt) -replace 'cmake_minimum_required\(VERSION.*\)', 'cmake_minimum_required(VERSION 3.10)' | Set-Content CMakeLists.txt"

      - name: 加载 MSVC x64 编译环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: CMake 配置 + NMake编译安装（启用libIDTF，内置ForceIdtf内存直转能力）
        shell: cmd
        run: |
          cd u3d-src
          mkdir build
          cd build
          cmake .. -G "NMake Makefiles" ^
            -Wno-dev ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\u3d-output ^
            -DU3D_SHARED:BOOL=OFF
          nmake install

      - name: 打包输出文件
        uses: actions/upload-artifact@v4
        with:
          name: alemuntoni-u3d-libIDTF-x64
          path: ${{ github.workspace }}\u3d-output
