name: Build u3d IDTFConverter x64
on:
  push:
    branches: [ main ]
  workflow_dispatch: # ✅ 重点！可以手动点按钮触发编译（小白首选）

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: 拉取源码 ningfei/u3d
        uses: actions/checkout@v4
        with:
          repository: ningfei/u3d
          path: u3d-src

      - name: 加载 MSVC x64 编译环境（关键，替代手动开vcvars64）
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: CMake 配置 + NMake编译安装
        shell: cmd
        run: |
          cd u3d-src
          mkdir build
          cd build
          cmake .. -G "NMake Makefiles" ^
            -Wno-dev ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\u3d-output ^
            -DU3D_SHARED:BOOL=OFF
          nmake install

      - name: 打包输出文件
        uses: actions/upload-artifact@v4
        with:
          name: u3d-x64-bin
          path: ${{ github.workspace }}\u3d-output
