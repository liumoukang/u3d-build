name: Build u3d IDTFConverter x64
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: 拉取源码 ningfei/u3d
        uses: actions/checkout@v4
        with:
          repository: ningfei/u3d
          path: u3d-src

      - name: CMake 生成VS工程
        run: |
          cd u3d-src
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\u3d-output ^
            -DU3D_SHARED:BOOL=OFF

      - name: MSBuild编译+安装
        run: |
          cd u3d-src/build
          msbuild ALL_BUILD.vcxproj /p:Configuration=Release
          msbuild INSTALL.vcxproj /p:Configuration=Release

      - name: 打包输出文件
        uses: actions/upload-artifact@v4
        with:
          name: u3d-x64-bin
          path: ${{ github.workspace }}\u3d-output
