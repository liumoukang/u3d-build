name: Build ningfei/u3d + io_u3d.dll x64
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 加载 MSVC x64 编译环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ==========第一步：编译 ningfei/u3d（和之前成功版本完全一致，不动）==========
      - name: Clone ningfei/u3d source
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/ningfei/u3d.git u3d-src
          cd u3d-src
          powershell -Command "(Get-Content CMakeLists.txt) -replace 'cmake_minimum_required\(VERSION.*\)', 'cmake_minimum_required(VERSION 3.10)' | Set-Content CMakeLists.txt"
          mkdir build
          cd build
          cmake .. -G "NMake Makefiles" ^
            -Wno-dev ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=%GITHUB_WORKSPACE%\u3d-install ^
            -DU3D_SHARED:BOOL=OFF
          nmake install

      # ==========第二步：MeshLab 固定commit，彻底杜绝tag问题==========
      - name: Clone MeshLab 2020.07 source
        shell: cmd
        run: |
          git clone https://github.com/cnr-isti-vclab/meshlab.git meshlab-src
          cd meshlab-src
          git checkout b56ae6f
          git submodule update --init vcglib

      # ==========第三步：Qt5.15.2 改用aqt原生安装，手动设置Qt5_DIR（重点修复，不再依赖action自动set env）==========
      - name: Install Qt5.15.2
        shell: cmd
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 --outputdir %GITHUB_WORKSPACE%\Qt
        env:
          PYTHONUNBUFFERED: 1

      # ==========第四步：生成io_u3d CMake，手动传入Qt5路径，不再依赖全局环境自动发现==========
      - name: Generate io_u3d CMakeLists.txt
        shell: cmd
        run: |
          set "WORKSPACE=%GITHUB_WORKSPACE%"
          set "QT5_ROOT=%WORKSPACE%\Qt\5.15.2\msvc2019_64"
          (
          echo cmake_minimum_required(VERSION 3.10)
          echo project(io_u3d)
          echo set(CMAKE_CXX_STANDARD 14)
          echo set(CMAKE_CXX_STANDARD_REQUIRED ON)
          echo set(Qt5_DIR "%QT5_ROOT%\lib\cmake\Qt5")
          echo find_package(Qt5 REQUIRED COMPONENTS Core)
          echo include_directories("%WORKSPACE%/meshlab-src/vcglib")
          echo include_directories("%WORKSPACE%/meshlab-src/meshlab/src")
          echo set(U3D_ROOT "%WORKSPACE%/u3d-install")
          echo include_directories(${U3D_ROOT}/include)
          echo link_directories(${U3D_ROOT}/lib)
          echo file(GLOB IO_U3D_SRCS "%WORKSPACE%/meshlab-src/meshlab/src/meshlabplugins/io_u3d/*.cpp" "%WORKSPACE%/meshlab-src/meshlab/src/meshlabplugins/io_u3d/*.h")
          echo add_library(io_u3d SHARED ${IO_U3D_SRCS})
          echo target_link_libraries(io_u3d IFXCore IFXExporting IFXImporting IFXScheduling Qt5::Core)
          echo target_compile_definitions(io_u3d PRIVATE QT_PLUGIN)
          echo set(CMAKE_INSTALL_PREFIX "%WORKSPACE%/io_u3d-plugin-out")
          echo install(TARGETS io_u3d RUNTIME DESTINATION Plugins)
          ) > io_u3d.cmake

      # ==========第五步：编译io_u3d.dll，额外打印日志方便排错==========
      - name: Build io_u3d.dll
        shell: cmd
        run: |
          mkdir build_io_u3d
          cd build_io_u3d
          cmake ..\io_u3d.cmake -G "NMake Makefiles" ^
            -Wno-dev ^
            -DCMAKE_BUILD_TYPE=Release
          nmake install
          dir %GITHUB_WORKSPACE%\io_u3d-plugin-out\Plugins

      # ==========打包==========
      - name: Collect all files
        shell: cmd
        run: |
          mkdir final_artifact
          xcopy /E /I io_u3d-plugin-out\Plugins final_artifact\Plugins
          xcopy /E /I u3d-install\bin final_artifact\IDTFConverter_x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: u3d-io_u3d-x64-full
          path: ${{ github.workspace }}\final_artifact
