name: Build patched io_u3d (full meshlab compile)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repo (contains io_u3d_wedge.patch)
        uses: actions/checkout@v4

      - name: Load MSVC 2019 x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build u3d static library
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/ningfei/u3d.git u3d-src
          cd u3d-src
          powershell -Command "(Get-Content CMakeLists.txt -Raw) -replace 'cmake_minimum_required\(VERSION.*\)', 'cmake_minimum_required(VERSION 3.10)' | Set-Content CMakeLists.txt -Encoding UTF8"
          mkdir build
          cd build
          cmake .. -G "Visual Studio 16 2019" -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=%GITHUB_WORKSPACE%\u3d-install ^
            -DU3D_SHARED:BOOL=OFF
          cmake --build . --config Release
          cmake --install .

      - name: Checkout MeshLab b56ae6f
        shell: cmd
        run: |
          git clone https://github.com/cnr-isti-vclab/meshlab.git meshlab-src
          cd meshlab-src
          git checkout b56ae6f
          git submodule update --init vcglib

      - name: Apply wedge crash patch
        shell: cmd
        run: |
          cd meshlab-src
          git apply %GITHUB_WORKSPACE%\io_u3d_wedge.patch

      - name: Install Qt5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          install-deps: true

      - name: Build full MeshLab
        shell: cmd
        run: |
          cd meshlab-src
          mkdir build
          cd build
          cmake .. -G "Visual Studio 16 2019" -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DQT_QMAKE_EXECUTABLE=%QT_ROOT_DIR%\bin\qmake.exe ^
            -DU3D_ROOT=%GITHUB_WORKSPACE%\u3d-install
          cmake --build . --config Release

      - name: Collect artifacts
        shell: cmd
        run: |
          mkdir final_artifact
          xcopy /E /I meshlab-src\build\distrib final_artifact\MeshLab
          xcopy /E /I u3d-install\bin final_artifact\IDTFConverter_x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshlab-full-patched-io_u3d-x64
          path: ${{ github.workspace }}\final_artifact
