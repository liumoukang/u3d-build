name: Build patched io_u3d (full meshlab compile)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Load MSVC 2019 x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build ningfei/u3d static library
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/ningfei/u3d.git u3d-src
          cd u3d-src
          powershell -Command "(Get-Content CMakeLists.txt -Raw) -replace 'cmake_minimum_required\(VERSION.*\)', 'cmake_minimum_required(VERSION 3.10)' | Set-Content CMakeLists.txt -Encoding UTF8"
          mkdir build
          cd build
          cmake .. -G "Visual Studio 16 2019" -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=%GITHUB_WORKSPACE%\u3d-install ^
            -DU3D_SHARED:BOOL=OFF
          cmake --build . --config Release
          cmake --install .

      - name: Checkout MeshLab b56ae6f
        shell: cmd
        run: |
          git clone https://github.com/cnr-isti-vclab/meshlab.git meshlab-src
          cd meshlab-src
          git checkout b56ae6f
          git submodule update --init vcglib

      - name: Apply wedge crash patch to io_u3d.cpp
        shell: powershell
        run: |
          $cppPath = "$env:GITHUB_WORKSPACE/meshlab-src/meshlab/src/meshlabplugins/io_u3d/io_u3d.cpp"
          $content = Get-Content $cppPath -Raw
          # 插入 totalWedgeCount 统计
          $content = $content -replace '(int vn = 0;\s*int vc = 0;\s*int vq = 0;)', @'
int vn = 0;
int vc = 0;
int vq = 0;
int totalWedgeCount = 0;
for(auto &f : m.face)
{
    totalWedgeCount +=3;
}
'@
          # 修改 SetWedgeTexCoords 分配大小
          $content = $content -replace '_mm_malloc\(sizeof\(IFXVector2\)\*m\.vert\.size\(\),16\)', '_mm_malloc(sizeof(IFXVector2)*totalWedgeCount,16)'
          # 增加wedge索引边界判断
          $content = $content -replace '(for \(int j=0;j<3;\+\+j\)\s*\{)', @'
for (int j=0;j<3;++j)
{
    int wedgeIdx = i*3 + j;
    if(wedgeIdx >= totalWedgeCount)
    {
        continue;
    }
'@
          Set-Content -Path $cppPath -Value $content -Encoding UTF8
          Write-Host "Patch applied successfully"

      - name: Install Qt5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          install-deps: true

      - name: Build full MeshLab
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%\meshlab-src
          mkdir build
          cd build
          cmake .. -G "Visual Studio 16 2019" -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DQT_QMAKE_EXECUTABLE=%QT_ROOT_DIR%\bin\qmake.exe ^
            -DU3D_ROOT=%GITHUB_WORKSPACE%\u3d-install
          cmake --build . --config Release

      - name: Collect artifacts
        shell: cmd
        run: |
          mkdir final_artifact
          xcopy /E /I %GITHUB_WORKSPACE%\meshlab-src\build\distrib final_artifact\MeshLab
          xcopy /E /I %GITHUB_WORKSPACE%\u3d-install\bin final_artifact\IDTFConverter_x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshlab-full-patched-io_u3d-x64
          path: ${{ github.workspace }}\final_artifact
